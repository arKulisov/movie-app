<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MovieFinder</title>
    <link rel="stylesheet" href="style.css" />
    <script type="module" src="js/main.js"></script>
  </head>
  <body>
    <header class="header">
      <h1 class="header__title">MovieSearch</h1>
      <div class="search">
        <input
          type="text"
          name="search"
          class="search__input"
          id="search-input"
        />
        <button type="button" class="search__button">Поиск</button>
      </div>
    </header>
    <main class="main">
      <div id="loader" class="loader loader--hidden">
        <div class="loader__spinner"></div>
      </div>
      <aside class="categories">
        <ul>
          <li>Главная</li>
          <li>Фильмы</li>
          <li>Сериалы</li>
          <li>Мультфильмы</li>
          <li>Аниме</li>
        </ul>
      </aside>
      <section class="section">
        <div class="content"></div>
        <div id="sentinel"></div>
      </section>
      
      <aside class="filters">
  <details class="filters__group filters__group--genres" name="filters">
    <summary class="filters__name">Жанры</summary>
    <div class="filters__dropdown" data-type="genres"></div>
  </details>

  <details class="filters__group filters__group--year" name="filters">
    <summary class="filters__name">Год</summary>
    <div class="filters__dropdown" data-type="year">
      <div class="slider slider-year">
        <div class="slider__track">
          <div class="slider__active"></div>

          <div class="slider__thumb slider__thumb--left">
            <span class="slider__value slider__value--from">1900</span>
          </div>
          <div class="slider__thumb slider__thumb--right">
            <span class="slider__value slider__value--to">2026</span>
          </div>
        </div>
      </div>
      <div class="filters__quick">
        <span class="filters__quick-item" data-year="1900">до 30-х</span>
        <span class="filters__quick-item" data-year="1930">30-е</span>
        <span class="filters__quick-item" data-year="1940">40-е</span>
        <span class="filters__quick-item" data-year="1950">50-е</span>
        <span class="filters__quick-item" data-year="1960">60-е</span>
        <span class="filters__quick-item" data-year="1970">70-е</span>
        <span class="filters__quick-item" data-year="1980">80-е</span>
        <span class="filters__quick-item" data-year="1990">90-е</span>
        <span class="filters__quick-item" data-year="2000">2000-е</span>
        <span class="filters__quick-item" data-year="2010">2010-е</span>
        <span class="filters__quick-item" data-year="2020">2020-е</span>
      </div>
    </div>
  </details>

  <details class="filters__group filters__group--rating" name="filters">
    <summary class="filters__name">Рейтинг</summary>
    <div class="filters__dropdown" data-type="rating">
      <div class="slider slider-rating">
        <div class="slider__track">
          <div class="slider__active"></div>

          <div class="slider__thumb slider__thumb--left">
            <span class="slider__value slider__value--from">0.0</span>
          </div>
          <div class="slider__thumb slider__thumb--right">
            <span class="slider__value slider__value--to">10.0</span>
          </div>
        </div>
      </div>
    </div>
  </details>

  <details class="filters__group filters__group--sort" name="filters">
    <summary class="filters__name">По популярности</summary>
    <div class="filters__dropdown" data-type="sort">
      <span class="filters__list-item" data-sort="popularity.desc">По популярности</span>
      <span class="filters__list-item" data-sort="vote_average.desc">По рейтингу</span>
      <span class="filters__list-item" data-sort="primary_release_date.asc">По дате выхода</span>
    </div>
  </details>
</aside>
    </main>
    <template id="movie-card">
      <div class="movie-card">
        <img class="movie-card__poster" width="100" height="150" loading="lazy"/>
        <span class="movie-card__rating"></span>

      </div>
    </template>
  </body>
</html>
